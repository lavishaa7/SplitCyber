version: '3.8'

services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: splitcyber_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: expense_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  # SplitCyber Application Service (Backend + Frontend)
  app:
    build: .
    container_name: splitcyber_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpassword
      MYSQL_DB: expense_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
